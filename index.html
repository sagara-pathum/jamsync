<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Meeting Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Main Layout -->
        <div id="meeting-screen" class="screen main-layout">
            <!-- Left Side: Video Stream -->
            <div class="left-side">
                <div id="stream-stage" class="stream-stage">
                    <div id="main-video-container" class="video-container">
                        <video id="main-video" autoplay playsinline muted></video>
                        <div id="main-placeholder" class="placeholder">
                            <span class="user-initials">?</span>
                        </div>
                        <div class="user-label">Stream Stage</div>
                    </div>
                </div>

                <div id="participant-row" class="participant-row">
                    <!-- Participant thumbnails will be added here -->
                </div>

                <div class="controls-bar">
                    <button id="toggle-cam" class="control-btn">Cam Off</button>
                    <button id="toggle-mic" class="control-btn">Mic Off</button>
                    <button id="leave-btn" class="control-btn leave">Leave Room</button>
                </div>
            </div>

            <!-- Right Side: Join Form then Chat -->
            <div class="right-side">
                <!-- Join Form (Visible before joining) -->
                <div id="join-form" class="side-form-container">
                    <h2>Join Meeting</h2>
                    <input type="text" id="username-input" placeholder="User Name">
                    <input type="text" id="room-id-input" placeholder="Room ID">
                    <button id="join-btn">Join Room</button>
                </div>

                <!-- Chat Room (Visible after joining) -->
                <div id="chat-room" class="chat-container hidden">
                    <div class="chat-header">Chat Room</div>
                    <div id="chat-messages" class="chat-messages"></div>
                    <div class="chat-input-area">
                        <input type="text" id="chat-input" placeholder="Type a message...">
                        <button id="send-msg-btn">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
